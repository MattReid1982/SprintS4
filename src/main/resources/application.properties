spring.application.name=airport-api

# Dynamic Server Port (Cloud Run injects PORT)
server.port=${PORT:${SERVER_PORT:8080}}

# Database configuration (Defaults to localhost:3306 for local docker & Cloud Run sidecar)
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/airportdb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:rootpassword}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema and data initialization
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect